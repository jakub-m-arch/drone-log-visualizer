[package]
name = "drone-log-visualizer"
version = "0.1.0"
edition = "2024"

[dependencies]
aes = "0.8"
axum = { version = "0.8", features = ["multipart"] }
base64 = "0.21"
cbc = "0.1"
chrono = "0.4.45"
crc64 = "2"
dji-log-parser = "=0.5.7"
hex = "0.4.3"
reqwest = { version = "0.13.5", default-features = false, features = ["form", "json", "rustls", "system-proxy"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "sqlite", "migrate", "macros"] }
thiserror = "2.0.21"
tiff = "0.11"
tokio = { version = "1.53.2", features = ["full"] }
tower-http = { version = "0.7.1", features = ["fs", "trace", "limit"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[dev-dependencies]
http-body-util = "0.1.5"
tempfile = "3.27.0"
tower = { version = "0.5.3", features = ["util"] }
