services:
  drone-log-visualizer:
    build: .
    image: drone-log-visualizer:latest
    ports:
      - "${PORT:-8080}:8080"
    environment:
      # Read from your shell or from the .env file next to this compose file.
      # Optional: only needed for encrypted logs (format v13+, current DJI apps).
      DJI_API_KEY: ${DJI_API_KEY:-}
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-200}
      MAP_TILE_URL: ${MAP_TILE_URL:-https://tile.openstreetmap.org/{z}/{x}/{y}.png}
      MAP_TERRAIN_URL: ${MAP_TERRAIN_URL:-}
      MAP_VECTOR_TILES_URL: ${MAP_VECTOR_TILES_URL:-}
      OVERPASS_URL: ${OVERPASS_URL:-}
      GUGIK_NMT_URL: ${GUGIK_NMT_URL:-}
      GUGIK_NMPT_URL: ${GUGIK_NMPT_URL:-}
      RUST_LOG: ${RUST_LOG:-info}
    volumes:
      - dji-data:/data
    restart: unless-stopped

volumes:
  # Name kept from earlier versions so existing flights stay where they are.
  dji-data:
